<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">

<title>김씨네한우 월드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>

  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; overflow:hidden; background:#b9dcf2; font-family:'Noto Sans KR',system-ui,sans-serif; color:var(--ink); -webkit-user-select:none; user-select:none; }
  #c { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; outline:none; }
  #labels { position:fixed; inset:0; pointer-events:none; overflow:hidden; }
  .label { position:absolute; left:0; top:0; font-weight:700; font-size:12px; color:#fff; background:rgba(42,26,31,.6); padding:2px 9px 3px; border-radius:10px; white-space:nowrap; will-change:transform; }
  .label.me { background:var(--wine); }
  .label.staff { background:var(--gold); color:var(--ink); }
  .label.sign { background:var(--cream); color:var(--wine); font-size:13px; border:1.5px solid var(--wine); }
  .label.live { background:#0f9d58; }
  .label.live::before { content:'● '; color:#b9f6ca; }
  #liveCount { display:none; margin-left:8px; color:#0f9d58; font-weight:700; }
  .label.promo { background:var(--wine); color:#fff; font-size:14px; padding:5px 12px; border:2px solid var(--gold); }
  .bubble { position:absolute; left:0; top:0; display:none; max-width:220px; background:#fff; color:var(--ink); font-size:13px; line-height:1.4; padding:7px 11px; border-radius:14px; box-shadow:0 4px 14px rgba(0,0,0,.15); white-space:normal; word-break:keep-all; overflow-wrap:anywhere; will-change:transform; }
  .bubble::after { content:''; position:absolute; left:50%; bottom:-6px; margin-left:-6px; border:6px solid transparent; border-bottom:0; border-top-color:#fff; }

  .hud { position:fixed; z-index:5; }
  .panel { background:var(--glass); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border-radius:16px; box-shadow:0 8px 26px rgba(60,20,30,.16); }
  #title { top:14px; left:14px; padding:10px 14px; border-left:5px solid var(--wine); max-width:calc(100vw - 28px); }
  #title h1 { margin:0; font-family:'Black Han Sans',sans-serif; font-weight:400; font-size:21px; color:var(--wine); letter-spacing:.5px; }
  #title .online { font-size:12px; margin-top:3px; color:#5b4a4f; cursor:pointer; }
  #who { display:none; margin-top:6px; font-size:12px; line-height:1.7; max-height:46vh; overflow:auto; }
  #who span { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:6px; vertical-align:-1px; box-shadow:0 0 0 1px #ccc; }
  #tools { top:14px; right:14px; display:flex; gap:8px; align-items:flex-start; flex-wrap:wrap; justify-content:flex-end; max-width:calc(100vw - 260px); }
  #help { padding:10px 14px; font-size:12px; line-height:1.75; }
  #help b { display:inline-block; min-width:48px; }
  .tbtn { display:inline-flex; align-items:center; border:0; height:40px; padding:0 13px; border-radius:12px; background:var(--glass); backdrop-filter:blur(10px); box-shadow:0 4px 14px rgba(60,20,30,.14); font:inherit; font-weight:700; font-size:13px; color:var(--wine); cursor:pointer; white-space:nowrap; text-decoration:none; }
  .tbtn:hover { background:#fff; }
  .tbtn.store { background:#03c75a; color:#fff; }
  .tbtn.store:hover { background:#02b350; }
  #log { left:14px; bottom:76px; width:min(360px, calc(100vw - 28px)); display:flex; flex-direction:column; gap:4px; pointer-events:none; }
  #log div { background:rgba(42,26,31,.55); color:#fff; font-size:13px; padding:4px 10px; border-radius:10px; width:fit-content; max-width:100%; transition:opacity 1s; overflow-wrap:anywhere; }
  #log b { margin-right:6px; }
  #chatbar { left:50%; bottom:16px; transform:translateX(-50%); width:min(460px, calc(100vw - 28px)); display:flex; gap:6px; padding:6px; }
  #chat { flex:1; min-width:0; border:0; background:transparent; font:inherit; font-size:14px; padding:8px 10px; outline:none; color:var(--ink); }
  #chatbar button { border:0; background:var(--wine); color:#fff; font:inherit; font-weight:700; border-radius:11px; padding:0 16px; cursor:pointer; }
  #emotes { right:14px; bottom:76px; display:flex; flex-direction:column; gap:8px; }
  .ebtn { width:46px; height:46px; border:0; border-radius:14px; font-size:21px; background:var(--glass); backdrop-filter:blur(10px); box-shadow:0 4px 14px rgba(60,20,30,.14); cursor:pointer; }
  .ebtn:active { transform:scale(.94); }
  #prompt { left:50%; bottom:84px; transform:translateX(-50%); display:none; border:0; padding:10px 18px; font:inherit; font-weight:700; font-size:15px; color:#fff; background:var(--wine); border-radius:14px; box-shadow:0 6px 18px rgba(123,30,52,.35); cursor:pointer; text-align:center; }
  #prompt kbd { display:inline-block; min-width:24px; padding:1px 6px; margin-right:8px; border-radius:6px; background:#fff; color:var(--wine); font:inherit; font-size:13px; }
  #prompt small { display:block; font-weight:400; font-size:11px; opacity:.85; margin-top:2px; }
  #holdTag { left:50%; bottom:136px; transform:translateX(-50%); display:none; padding:6px 12px; font-size:12px; font-weight:700; color:var(--wine); }
  #toast { top:132px; left:50%; transform:translateX(-50%); padding:10px 18px; font-weight:700; font-size:15px; color:var(--wine); opacity:0; transition:opacity .4s; pointer-events:none; white-space:nowrap; }
  #fade { position:fixed; inset:0; z-index:15; background:#1a0b10; opacity:0; pointer-events:none; transition:opacity .3s; }
  #joy { left:22px; bottom:90px; width:120px; height:120px; border-radius:50%; background:rgba(255,255,255,.35); border:2px solid rgba(255,255,255,.75); display:none; touch-action:none; }
  #knob { position:absolute; left:50%; top:50%; width:50px; height:50px; margin:-25px 0 0 -25px; border-radius:50%; background:rgba(255,255,255,.92); box-shadow:0 3px 10px rgba(0,0,0,.2); }
  #jumpBtn { display:none; }
  body.touch #joy, body.touch #jumpBtn { display:block; }
  body.touch #help { display:none; }
  body.touch #tools { max-width:calc(100vw - 28px); top:84px; }
  body.touch #log { bottom:222px; }
  body.touch #prompt { bottom:230px; }
  body.touch #holdTag { bottom:282px; }
  body.customizing .hud:not(#title):not(#tools) { display:none !important; }
  body.customizing #help { display:none; }

  #custom { position:fixed; z-index:12; right:24px; top:50%; transform:translateY(-50%); width:340px; max-height:calc(100vh - 40px); overflow:auto; padding:22px 20px 18px; }
  #custom h2 { margin:0; font-family:'Black Han Sans',sans-serif; font-weight:400; font-size:28px; color:var(--wine); }
  #custom p { margin:4px 0 16px; font-size:13px; color:#6b5a5f; }
  #custom label { display:block; font-size:12px; font-weight:700; color:#6b5a5f; margin:12px 0 7px 2px; }
  #nick { width:100%; border:2px solid #eadfd3; border-radius:12px; padding:10px 12px; font:inherit; font-size:15px; outline:none; background:#fff; }
  #nick:focus { border-color:var(--wine); }
  .chips { display:flex; flex-wrap:wrap; gap:7px; }
  .chip { border:2px solid #eadfd3; background:#fff; border-radius:999px; padding:6px 12px; font:inherit; font-size:13px; cursor:pointer; color:var(--ink); }
  .chip.on { border-color:var(--wine); background:var(--wine); color:#fff; }
  .sw { width:30px; height:30px; border-radius:50%; border:3px solid #fff; box-shadow:0 0 0 2px #eadfd3; cursor:pointer; padding:0; }
  .sw.on { box-shadow:0 0 0 2.5px var(--wine); }
  #enter { width:100%; margin-top:20px; border:0; border-radius:14px; padding:13px; font-family:'Black Han Sans',sans-serif; font-size:20px; letter-spacing:.5px; background:var(--wine); color:#fff; cursor:pointer; }
  #enter:hover { background:var(--wine2); }
  body.touch #custom { left:10px; right:10px; top:auto; bottom:10px; transform:none; width:auto; max-height:52vh; padding:16px; }
  body.touch #custom h2 { font-size:22px; }

  .modal { position:fixed; inset:0; z-index:14; display:none; align-items:center; justify-content:center; background:rgba(26,11,16,.45); }
  .modal .sheet { width:min(460px, calc(100vw - 28px)); max-height:calc(100vh - 40px); overflow:auto; background:var(--cream); border-radius:18px; padding:22px 22px 18px; position:relative; border-top:8px solid var(--wine); }
  .modal h3 { margin:0; font-family:'Black Han Sans',sans-serif; font-weight:400; font-size:26px; color:var(--wine); }
  .modal .sub { font-size:12px; color:#7b6a6f; margin:2px 0 14px; }
  .modal .x { position:absolute; right:12px; top:10px; border:0; background:none; font-size:26px; color:var(--wine); cursor:pointer; }
  .modal small.note { display:block; margin-top:12px; font-size:11px; color:#9a898e; }
  .mrow { display:flex; align-items:center; gap:10px; padding:11px 0; border-bottom:1px dashed #dccbbb; }
  .grade { flex:none; font-size:11px; font-weight:900; color:#fff; background:var(--wine); border-radius:6px; padding:3px 6px; }
  .mrow .nm { font-weight:700; font-size:15px; }
  .mrow .ds { font-size:12px; color:#7b6a6f; }
  .mrow .pr { margin-left:auto; font-weight:700; color:var(--wine); white-space:nowrap; font-size:14px; }
  .grow { cursor:pointer; border-radius:12px; padding:10px 8px; margin:0 -8px; border-bottom:0; }
  .grow:hover { background:#fff; }
  .gbox { --c:#7b1e34; --r:#c9a45c; flex:none; width:58px; height:46px; border-radius:7px; background:var(--c); position:relative; box-shadow:inset 0 -6px 0 rgba(0,0,0,.18), 0 3px 8px rgba(0,0,0,.15); }
  .gbox::before { content:''; position:absolute; left:50%; top:0; bottom:0; width:16%; transform:translateX(-50%); background:var(--r); }
  .gbox::after { content:''; position:absolute; top:42%; left:0; right:0; height:18%; background:var(--r); }
  .gbox.big { width:150px; height:112px; border-radius:12px; margin:6px auto 16px; }
  .gdetail { text-align:center; }
  .gdetail .nm { font-family:'Black Han Sans',sans-serif; font-size:24px; color:var(--wine); }
  .gdetail .items { font-size:14px; margin:6px 0 2px; }
  .gdetail .ds { font-size:12px; color:#7b6a6f; }
  .gdetail .pr { font-size:22px; font-weight:900; color:var(--wine); margin:12px 0 16px; }
  .btn { display:block; width:100%; border:0; border-radius:13px; padding:13px; font:inherit; font-weight:700; font-size:15px; cursor:pointer; text-align:center; text-decoration:none; margin-top:8px; }
  .btn.primary { background:var(--wine); color:#fff; }
  .btn.primary:hover { background:var(--wine2); }
  .btn.naver { background:#03c75a; color:#fff; }
  .btn.ghost { background:#fff; color:var(--wine); border:2px solid #eadfd3; }
  .back { border:0; background:none; color:#7b6a6f; font:inherit; font-size:13px; cursor:pointer; padding:0; margin-bottom:6px; }
  #loading { position:fixed; inset:0; z-index:30; display:flex; flex-direction:column; gap:8px; align-items:center; justify-content:center; background:var(--wine); color:#fff; font-family:'Black Han Sans',sans-serif; font-size:30px; letter-spacing:1px; }
  #loading span { font-family:'Noto Sans KR'; font-size:13px; opacity:.8; letter-spacing:0; }
</style>
<script>
  // show any startup/runtime error on screen so it can be reported
  window.__showErr = (msg) => {
    let box = document.getElementById('errbox');
    if (!box) { box = document.createElement('div'); box.id = 'errbox'; box.style.cssText = 'position:fixed;left:12px;right:12px;bottom:12px;z-index:99;background:#fff;color:#7b1e34;border:2px solid #7b1e34;border-radius:12px;padding:10px 14px;font:13px/1.5 sans-serif;white-space:pre-wrap;max-height:40vh;overflow:auto;user-select:text;-webkit-user-select:text'; document.body.appendChild(box); box.textContent = '⚠️ 오류가 발생했어요 (이 내용을 캡처해서 알려주세요)\n'; }
    box.textContent += '\n' + msg;
  };
  addEventListener('error', e => window.__showErr((e.message || 'error') + (e.filename ? ' @ ' + e.filename.split('/').pop() + ':' + e.lineno : '')));
  addEventListener('unhandledrejection', e => window.__showErr('Promise: ' + (e.reason && (e.reason.stack || e.reason.message) || e.reason)));
</script>

  <div id="who"></div>
</div>
<div id="tools" class="hud">
  <div id="help" class="panel">
    <div><b>WASD</b>이동 · <b style="min-width:0">Shift</b> 달리기</div>
    <div><b>Space</b>점프 · <b style="min-width:0">E</b> 상호작용</div>
    <div><b>드래그</b>시점 · 휠 줌</div>
    <div><b>Enter</b>채팅 · <b style="min-width:0">1 2 3</b> 이모트</div>
  </div>
  <button class="tbtn" id="giftBtn">🎁 선물세트</button>
  <a class="tbtn store" id="storeBtn" target="_blank" rel="noopener">N 스마트스토어</a>
  <button class="tbtn" id="customBtn">👕 꾸미기</button>
  <button class="tbtn" id="nightBtn">🌙</button>
</div>
<div id="log" class="hud"></div>
<div id="holdTag" class="hud panel"></div>
<button id="prompt" class="hud"></button>
<form id="chatbar" class="hud panel" autocomplete="off">
  <input id="chat" maxlength="80" placeholder="Enter로 채팅 시작…">
  <button type="submit">전송</button>
</form>
<div id="emotes" class="hud">
  <button class="ebtn" data-e="wave" title="인사 (1)">👋</button>
  <button class="ebtn" data-e="dance" title="춤 (2)">💃</button>
  <button class="ebtn" data-e="cheer" title="환호 (3)">🎉</button>
  <button class="ebtn" id="jumpBtn" title="점프">⤴️</button>
</div>
<div id="joy" class="hud"><div id="knob"></div></div>
<div id="toast" class="hud panel"></div>

<div id="custom" class="panel">
  <h2>내 캐릭터 꾸미기</h2>
  <p>김씨네한우 월드에서 쓸 모습을 골라주세요</p>
  <label for="nick">닉네임</label>
  <input id="nick" maxlength="12" placeholder="닉네임을 입력하세요">
  <label>옷 색</label><div class="chips" id="optBody"></div>
  <label>헤어</label><div class="chips" id="optHair"></div>
  <label>헤어 색</label><div class="chips" id="optHairColor"></div>
  <label>모자 · 머리띠</label><div class="chips" id="optHat"></div>
  <label>앞치마</label><div class="chips" id="optApron"></div>
  <button id="enter">입장하기</button>
</div>

<div id="menu" class="modal"><div class="sheet">
  <button class="x" data-close aria-label="닫기">×</button>
  <h3>오늘의 한우</h3>
  <div class="sub" id="menuSub"></div>
  <div id="menuList"></div>
  <small class="note">※ 표시 가격은 예시입니다</small>
</div></div>

<div id="gift" class="modal"><div class="sheet">
  <button class="x" data-close aria-label="닫기">×</button>
  <div id="giftBody"></div>
</div></div>

const colliders = [];
const addBox = (x0, x1, z0, z1) => colliders.push({ t:'b', x0, x1, z0, z1 });
const addCircle = (x, z, r) => colliders.push({ t:'c', x, z, r });
function distTo(c, x, z) {
  if (c.t === 'b') { const cx = Math.max(c.x0, Math.min(x, c.x1)), cz = Math.max(c.z0, Math.min(z, c.z1)); return Math.hypot(x - cx, z - cz); }
  return Math.hypot(x - c.x, z - c.z) - c.r;
}
const isFree = (x, z, r) => colliders.every(c => distTo(c, x, z) >= r);

const zoneOf = p => p.x > 600 ? 'gift' : p.x > 200 ? 'in' : 'out';
function collide(p, r = .5) {
  for (const c of colliders) {
    if (c.t === 'c') {
      const dx = p.x - c.x, dz = p.z - c.z, d = Math.hypot(dx, dz), m = c.r + r;
      if (d < m && d > 1e-4) { p.x = c.x + dx / d * m; p.z = c.z + dz / d * m; }
    } else {
      const cx = Math.max(c.x0, Math.min(p.x, c.x1)), cz = Math.max(c.z0, Math.min(p.z, c.z1));
      const dx = p.x - cx, dz = p.z - cz, d = Math.hypot(dx, dz);
      if (d < r) {
        if (d > 1e-4) { p.x = cx + dx / d * r; p.z = cz + dz / d * r; }
        else {
          const l = p.x - c.x0, rr = c.x1 - p.x, t = p.z - c.z0, b = c.z1 - p.z, m = Math.min(l, rr, t, b);
          if (m === l) p.x = c.x0 - r; else if (m === rr) p.x = c.x1 + r; else if (m === t) p.z = c.z0 - r; else p.z = c.z1 + r;
        }
      }
    }
  }
  if (zoneOf(p) === 'out') { const d0 = Math.hypot(p.x, p.z); if (d0 > 80) { p.x *= 80 / d0; p.z *= 80 / d0; } }
}

function makeRoom(O, hw, hd, opts) {
  const H = opts.height || 4.6;
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(hw * 2, hd * 2), new THREE.MeshStandardMaterial({ map:opts.floorTex, roughness:opts.floorRough ?? .7 }));
  floor.rotation.x = -Math.PI / 2; floor.position.set(O.x, .02, O.z); floor.receiveShadow = true; scene.add(floor);
  const yard = new THREE.Mesh(new THREE.PlaneGeometry(120, 120), mat(0x6f9b55)); yard.rotation.x = -Math.PI / 2; yard.position.set(O.x, -.01, O.z); scene.add(yard);
  const wall = (ax, az, bx, bz, nx, nz) => {
    const lowM = mat(opts.low, { transparent:true }), upM = mat(opts.up, { transparent:true }), trimM = smooth(BRAND.gold, { transparent:true, metalness:.4 });
    const len = Math.hypot(bx - ax, bz - az), alongX = Math.abs(bz - az) < .01;
    const cx = O.x + (ax + bx) / 2, cz = O.z + (az + bz) / 2;
    const mk = (h, y, m) => { const b = alongX ? box(len, h, .3, m) : box(.3, h, len, m); b.position.set(cx, y, cz); b.receiveShadow = true; scene.add(b); };
    mk(1.2, .6, lowM); mk(H - 1.2, 1.2 + (H - 1.2) / 2, upM); mk(.08, 1.24, trimM);
    if (alongX) addBox(cx - len / 2, cx + len / 2, cz - .2, cz + .2); else addBox(cx - .2, cx + .2, cz - len / 2, cz + len / 2);
    const w = { mats:[lowM, upM, trimM], center:new THREE.Vector3(cx, 2, cz), n:new THREE.Vector3(nx, 0, nz) };
    walls.push(w); return w;
  };
  const back = wall(-hw, -hd, hw, -hd, 0, 1), left = wall(-hw, -hd, -hw, hd, 1, 0), right = wall(hw, -hd, hw, hd, -1, 0);
  const front = wall(-hw, hd, -1.5, hd, 0, -1), front2 = wall(1.5, hd, hw, hd, 0, -1);
  const dm = mat(0x4a1020, { transparent:true }), lm = mat(opts.up, { transparent:true });
  scene.add(box(3, H - 3, .3, lm, O.x, 3 + (H - 3) / 2, O.z + hd), box(2.8, 3, .12, dm, O.x, 1.5, O.z + hd));
  front.mats.push(dm, lm); front2.mats.push(dm, lm);
  addBox(O.x - 1.6, O.x + 1.6, O.z + hd - .2, O.z + hd + .2);
  interactables.push({ pos:new THREE.Vector3(O.x, 0, O.z + hd - 1.1), r:1.9, label:'밖으로 나가기', act:() => goTo('out', opts.exitTo) });
  return { back, left, right };
}

const SKIN = [0xffe0bd, 0xf1c27d, 0xe0ac69, 0xffdbac];
const eyeGeo = new THREE.SphereGeometry(.06, 8, 6), eyeMat = new THREE.MeshBasicMaterial({ color:0x222222 }), blushMat = new THREE.MeshBasicMaterial({ color:0xff9aa2 });

function buildBody(look) {
  const pivot = new THREE.Group();
  const bc = new THREE.Color(look.body), hsl = {}; bc.getHSL(hsl);
  const cM = smooth(look.body, { roughness:.55 });
  const pM = smooth(hsl.l > .7 ? 0x3b4252 : bc.clone().multiplyScalar(.55));
  const sM = smooth(look.skin ?? SKIN[0], { roughness:.7 });
  const hM = smooth(look.hairColor, { roughness:.7 });
  const body = new THREE.Mesh(new THREE.CapsuleGeometry(.42, .55, 4, 14), cM); body.position.y = 1.1;
  const head = new THREE.Mesh(new THREE.SphereGeometry(.42, 22, 16), sM); head.position.y = 1.95;
  pivot.add(body, head);
  for (const sx of [-1, 1]) {
    const e = new THREE.Mesh(eyeGeo, eyeMat); e.position.set(sx * .14, 2.0, .385); pivot.add(e);
    const b = new THREE.Mesh(eyeGeo, blushMat); b.scale.set(1.5, .8, .5); b.position.set(sx * .25, 1.88, .35); pivot.add(b);
  }
  if (look.hair !== 'bald') {
    const cap = new THREE.Mesh(new THREE.SphereGeometry(.45, 22, 12, 0, Math.PI * 2, 0, Math.PI / 2.3), hM); cap.position.y = 1.99; cap.rotation.x = -.28; pivot.add(cap);
    if (look.hair === 'long') pivot.add(box(.8, .85, .26, hM, 0, 1.72, -.24));
    if (look.hair === 'bun') { const b = new THREE.Mesh(new THREE.SphereGeometry(.2, 14, 10), hM); b.position.set(0, 2.42, -.14); pivot.add(b); }
  }
  if (look.hat === 'chef') {
    const w = smooth(0xffffff);
    pivot.add(cyl(.37, .37, .3, w, 0, 2.33, 0, 20));
    const puff = new THREE.Mesh(new THREE.SphereGeometry(.43, 18, 12), w); puff.scale.set(1, .62, 1); puff.position.y = 2.6; pivot.add(puff);
  } else if (look.hat === 'cap') {
    const cm = smooth(BRAND.wine);
    const crown = new THREE.Mesh(new THREE.SphereGeometry(.47, 20, 12, 0, Math.PI * 2, 0, Math.PI / 2), cm); crown.position.y = 2.02; pivot.add(crown);
    pivot.add(box(.62, .04, .38, cm, 0, 2.06, .46), box(.16, .1, .02, smooth(BRAND.gold), 0, 2.25, .45));
  } else if (look.hat === 'horns') {
    const band = new THREE.Mesh(new THREE.TorusGeometry(.45, .04, 6, 20, Math.PI), smooth(0x3a2a2a)); band.position.y = 2.0; pivot.add(band);
    for (const s of [-1, 1]) {
      const h = new THREE.Mesh(new THREE.ConeGeometry(.07, .3, 8), smooth(0xf3ead7)); h.position.set(s * .3, 2.42, 0); h.rotation.z = -s * .5; pivot.add(h);
      const e = box(.24, .1, .14, smooth(0xb5682c), s * .5, 2.1, 0); e.rotation.z = s * .4; pivot.add(e);
    }
  } else if (look.hat === 'ribbon') {
    const rm = smooth(0xe57399);
    for (const s of [-1, 1]) { const c = new THREE.Mesh(new THREE.ConeGeometry(.12, .22, 4), rm); c.position.set(.22 + s * .12, 2.33, .05); c.rotation.z = s * Math.PI / 2; pivot.add(c); }
    const k = new THREE.Mesh(new THREE.SphereGeometry(.06, 8, 6), rm); k.position.set(.22, 2.33, .05); pivot.add(k);
  }
  if (look.apron) {
    const ap = new THREE.Mesh(new THREE.CylinderGeometry(.45, .45, .78, 16, 1, true, -1.0, 2.0), smooth(BRAND.wine, { side:THREE.DoubleSide })); ap.position.y = 1.03; pivot.add(ap);
    pivot.add(box(.2, .12, .03, smooth(BRAND.gold), 0, 1.15, .45));
  }
  const legs = [], arms = [];
  for (const sx of [-1, 1]) {
    const lp = new THREE.Group(); lp.position.set(sx * .18, .62, 0);
    const lm = new THREE.Mesh(new THREE.CapsuleGeometry(.13, .32, 4, 8), pM); lm.position.y = -.3; lp.add(lm); pivot.add(lp); legs.push(lp);
    const ap = new THREE.Group(); ap.position.set(sx * .52, 1.42, 0);
    const am = new THREE.Mesh(new THREE.CapsuleGeometry(.11, .38, 4, 8), cM); am.position.y = -.3; ap.add(am);
    const hand = new THREE.Mesh(new THREE.SphereGeometry(.12, 10, 8), sM); hand.position.y = -.62; ap.add(hand);
    pivot.add(ap); arms.push(ap);
  }
  shadowAll(pivot, true, false);
  return { pivot, legs, arms };
}
function setLook(av, look) {
  if (av.pivot) av.root.remove(av.pivot);
  const parts = buildBody(look);
  av.root.add(parts.pivot); Object.assign(av, parts); av.look = { ...look }; av.color = look.body;
  if (av.holding != null) { av.holdMesh = null; setHolding(av, av.holding); }
  refreshWho();
}
function makeAvatar(look, name, kind = '') {
  const root = new THREE.Group(); scene.add(root);
  const label = document.createElement('div'); label.className = 'label' + (kind ? ' ' + kind : ''); label.textContent = name; labelsEl.appendChild(label);
  const bubble = document.createElement('div'); bubble.className = 'bubble'; labelsEl.appendChild(bubble);
  const av = { root, label, bubble, name, isPlayer:kind === 'me', phase:Math.random() * 6, moveAmt:0, emote:null, emoteT:0, bubbleT:0,
    vy:0, grounded:true, heading:0, vel:new THREE.Vector2(), seat:null, holding:null, holdMesh:null };
  setLook(av, look); avatars.push(av);
  return av;
}
function setHolding(av, idx) {
  if (av.holdMesh) { av.holdMesh.parent?.remove(av.holdMesh); av.holdMesh = null; }
  av.holding = idx;
  if (idx == null) return;
  const m = makeGiftMesh(idx, .85); m.position.set(0, 1.08, .62); av.pivot.add(m); av.holdMesh = m;
}

function say(av, text) {
  if (!av) return;
  av.bubble.textContent = text; av.bubble.style.display = 'block'; av.bubbleT = 3.5 + text.length * .09;
  if (av === player) netSend({ say:{ t:String(text).slice(0, 80), k:++netK.say } });
  if (av.isPlayer || zoneOf(av.root.position) === zoneOf(player.root.position)) logMsg(av.name, text, av.color);
}
function jump(av) { if (av.grounded && !av.seat) { av.vy = 9; av.grounded = false; } }
function emote(av, kind) {
  if (av.seat && kind !== 'wave') kind = 'wave';
  av.emote = kind; av.emoteT = kind === 'dance' ? 3.2 : 1.8;
  if (kind === 'cheer') jump(av);
  if (av === player) netSend({ emo:{ e:kind, k:++netK.emo } });
}
function sit(av, s) {
  if (s.occupant) return;
  if (av.seat) av.seat.occupant = null;
  s.occupant = av; av.seat = s; av.vel.set(0, 0); av.emote = null; av.vy = 0; av.grounded = true;
  av.root.position.set(s.pos.x, s.top - .42, s.pos.z); av.heading = s.heading; av.root.rotation.y = s.heading;
}
function standUp(av) {
  const s = av.seat; if (!s) return;
  s.occupant = null; av.seat = null;
  av.root.position.set(s.pos.x - Math.sin(s.heading) * .9, 0, s.pos.z - Math.cos(s.heading) * .9);
  collide(av.root.position);
}
function animateAvatar(av, dt, t) {
  if (!av.seat && (!av.grounded || av.vy)) {
    av.root.position.y += av.vy * dt; av.vy -= 25 * dt;
    if (av.root.position.y <= 0) { av.root.position.y = 0; av.vy = 0; av.grounded = true; }
  }
  av.phase += dt * (5 + av.moveAmt * 7);
  const sw = Math.sin(av.phase) * .85 * av.moveAmt;
  av.legs[0].rotation.x = sw; av.legs[1].rotation.x = -sw;
  av.arms[0].rotation.x = -sw * .8; av.arms[1].rotation.x = sw * .8;
  av.arms[0].rotation.z = -.08; av.arms[1].rotation.z = .08;
  av.pivot.rotation.y = 0;
  av.pivot.position.y = Math.abs(Math.sin(av.phase)) * .08 * av.moveAmt + Math.sin(t * 2 + av.phase * .01) * .012;
  if (av.seat) {
    av.legs[0].rotation.x = av.legs[1].rotation.x = -1.45;
    av.arms[0].rotation.x = av.arms[1].rotation.x = -.55; av.pivot.position.y = 0;
  } else if (!av.grounded) { av.legs[0].rotation.x = .5; av.legs[1].rotation.x = -.3; }
  if (av.holding != null) { av.arms[0].rotation.x = av.arms[1].rotation.x = -1.0; av.arms[0].rotation.z = .32; av.arms[1].rotation.z = -.32; }
  if (av.emote) {
    av.emoteT -= dt;
    const freeArms = av.holding == null;
    if (av.emote === 'wave' && freeArms) { av.arms[1].rotation.x = 0; av.arms[1].rotation.z = 2.6 + Math.sin(t * 14) * .35; }
    else if (av.emote === 'dance') {
      av.pivot.rotation.y = t * 7; av.pivot.position.y = Math.abs(Math.sin(t * 9)) * .25;
      if (freeArms) { av.arms[0].rotation.x = av.arms[1].rotation.x = 0; av.arms[0].rotation.z = -2.3 - Math.sin(t * 9) * .4; av.arms[1].rotation.z = 2.3 + Math.sin(t * 9) * .4; }
      av.legs[0].rotation.x = Math.sin(t * 9) * .4; av.legs[1].rotation.x = -Math.sin(t * 9) * .4;
    } else if (av.emote === 'cheer' && freeArms) { av.arms[0].rotation.x = av.arms[1].rotation.x = 0; av.arms[0].rotation.z = -2.8; av.arms[1].rotation.z = 2.8; }
    if (av.emoteT <= 0) av.emote = null;
  }
  if (av.bubbleT > 0) { av.bubbleT -= dt; if (av.bubbleT <= 0) av.bubble.style.display = 'none'; }
}
function turnTo(av, target, dt) {
  let d = target - av.heading;
  d = ((d + Math.PI) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2) - Math.PI;
  av.heading += d * (1 - Math.exp(-12 * dt)); av.root.rotation.y = av.heading;
}

    try { mod = await import(url); break; } catch (e) { console.warn('supabase load failed', url, e); }

  if (!mod) { toast('실시간 연결을 불러오지 못했어요 — 혼자 모드로 둘러보세요'); return; }
  supa = mod.createClient(SUPABASE.url, SUPABASE.key, { auth:{ persistSession:false }, realtime:{ params:{ eventsPerSecond:20 } } });
  const ch = supa.channel(SUPABASE.channel, { config:{ broadcast:{ self:false }, presence:{ key:myPeer } } });
  ch.on('broadcast', { event:'p' }, ({ payload }) => onRemote(payload))
    .on('presence', { event:'sync' }, () => { liveCount = Object.keys(ch.presenceState()).length; renderLive(); })
    .on('presence', { event:'join' }, ({ key }) => {
      if (key === myPeer) return;
      // greet newcomers with our full state so they can draw us right away
      setTimeout(() => { if (net && entered) { sendRaw({ ...myPres, ...myState() }); } }, 200 + Math.random() * 600);
    })
    .on('presence', { event:'leave' }, ({ key }) => { if (key !== myPeer) { lastSeen.delete(key); peerPres.delete(key); removePeer(key); } })
    .subscribe(async status => {
      if (status === 'SUBSCRIBED') {
        net = ch; lastSent = '';
        try { await ch.track({ at:Date.now() }); } catch (e) {}
        if (entered) sendRaw({ ...myPres, ...myState() });
        renderLive();
      } else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') {
        if (!net) toast('실시간 접속이 혼잡해요 — 잠시 후 다시 시도해 주세요');
        net = null; renderLive();
      } else if (status === 'CLOSED') { net = null; renderLive(); }
    });
}
function logVisit() { try { supa?.from('visits').insert({}).then(() => {}, () => {}); } catch (e) {} }
connectSupabase();

addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
$('#loading').remove();
frame();
</script>
